# Runs the warning rule tests and a full universal build on pushes to main, pull requests and
# manual runs, the same way test.sh and build.sh run locally. Notifications, alerts and screenshots need a logged-in Mac,
# so they aren't covered here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels its older run; every commit on main still finishes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only reads the code, so the job's token gets read access and nothing more
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Tests
        run: ./test.sh
      - name: Build
        run: ./build.sh
