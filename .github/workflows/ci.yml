# Runs the warning rule tests and a full universal build, the same way test.sh and build.sh
# run locally, on pushes to main, pull requests, manual runs and every Monday. It also checks
# each version tag against Info.plist, and the shell scripts with ShellCheck. Notifications,
# alerts and screenshots need a logged-in Mac, so they aren't covered here.
#
# Each run builds on two images and two toolchains, so a toolchain change shows up without
# editing a version here: macos-latest moves to newer macOS by itself, and the Command Line
# Tools jobs build the way the README tells users to (macOS 27's tools, for example, can't
# expand SwiftUI's @State, while Xcode's can). The weekly run catches image updates in weeks
# without a push.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# A newer push to the same pull request cancels its older run. Everything else is grouped by
# commit, so no run on main waits behind, or gets displaced by, another commit's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only reads the code, so the job's token gets read access and nothing more
permissions:
  contents: read

jobs:
  # A version tag only needs its number checked: main's own run already built that commit
  version-tag:
    name: Tag matches the app version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with Info.plist
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          echo "Tag v$tag, Info.plist $version"
          if [ "$tag" != "$version" ]; then
            echo "::error title=Version mismatch::Tag v$tag doesn't match CFBundleShortVersionString $version in Info.plist"
            exit 1
          fi

  # The scripts' quoting and error handling; ShellCheck comes preinstalled on Linux runners
  shellcheck:
    name: ShellCheck
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the scripts
        run: shellcheck --version && shellcheck build.sh test.sh docs/images/update-screenshots.sh

  test-and-build:
    name: ${{ matrix.runner }} · ${{ matrix.toolchain }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      # Let every combination finish, so a red one points at what differs
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
        toolchain: [Xcode, Command Line Tools]
    steps:
      # Pinned to a commit, since a tag can be moved; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scripts don't need git access, so the token isn't left in .git/config
          persist-credentials: false
      - name: Select the Command Line Tools
        if: matrix.toolchain == 'Command Line Tools'
        run: echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          {
            echo "### ${{ matrix.runner }} · ${{ matrix.toolchain }}"
            echo '```'
            sw_vers
            echo "Toolchain: $(xcode-select -p)${DEVELOPER_DIR:+ (DEVELOPER_DIR=$DEVELOPER_DIR)}"
            swift --version 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: ./test.sh
      - name: Build
        run: ./build.sh
      # build.sh stays quiet when it succeeds, so list any compiler warnings (deprecations from a
      # newer SDK, say) in the run summary as an early heads-up, without failing the build
      - name: Compiler warnings
        run: |
          warnings=$(grep -h "warning:" build/compile-*.log | sort -u || true)
          if [ -z "$warnings" ]; then
            echo "No compiler warnings"
            exit 0
          fi
          count=$(printf '%s\n' "$warnings" | wc -l | tr -d ' ')
          echo "::warning title=Compiler warnings::$count warning(s), listed in the run summary"
          {
            echo "### Compiler warnings (${{ matrix.runner }} · ${{ matrix.toolchain }})"
            echo '```'
            printf '%s\n' "$warnings"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the app is universal
        run: |
          archs=$(lipo -archs build/Flicker.app/Contents/MacOS/Flicker)
          echo "Architectures: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
      # Catches a crash at startup, such as a SwiftUI or AppKit change on a newer macOS. The
      # runner has a logged-in session, so the menu bar app can start; its panel isn't checked.
      - name: Launch the app
        run: |
          build/Flicker.app/Contents/MacOS/Flicker > launch.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "Flicker is still running after 8 s"
            kill "$pid"
          else
            status=0
            wait "$pid" || status=$?
            echo "Flicker exited during launch with status $status:"
            cat launch.log
            exit 1
          fi
